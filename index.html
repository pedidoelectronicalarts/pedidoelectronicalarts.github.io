<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Electronical Arts | Pedidos</title>
<meta name="description" content="Catálogo mayorista de Electronical Arts. Haz tu pedido por WhatsApp.">
<meta name="theme-color" content="#16243A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Electronical Arts">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EBF0F6; --surface:#FFFFFF; --ink:#16243A; --ink2:#55657C; --line:#D3DCE7;
  --cobalt:#2348D6; --cobalt-d:#1A37A8; --copper:#B8641F; --copper-bg:#F7EADD;
  --wa:#1E9E55; --warn:#B86A00; --bad:#C0392B; --r:10px;
  --f:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html[lang=ur]{--f:"Noto Nastaliq Urdu","Archivo",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{font:400 15px/1.45 var(--f);font-stretch:100%;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:84px}
html[lang=ur] body{line-height:2.1;font-size:15px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
img{display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* cabecera */
.top{background:var(--ink);color:#fff}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px}
.brand{font-family:"Archivo",system-ui,sans-serif;font-weight:800;font-stretch:125%;font-size:20px;letter-spacing:-.01em;line-height:1.1;margin:0;cursor:pointer;background:none;border:0;color:#fff;padding:0;text-align:start}
.brand small{display:block;font-weight:500;font-stretch:100%;font-size:12px;color:#A9B7CC;letter-spacing:0}
html[lang=ur] .brand small{font-family:"Noto Nastaliq Urdu",sans-serif;font-size:11px;line-height:1.9}
.lang{margin-inline-start:auto;display:flex;border:1px solid #3A4E6C;border-radius:999px;overflow:hidden;flex:none}
.lang button{background:none;border:0;color:#C7D2E3;padding:6px 12px;cursor:pointer;font-size:13px;line-height:1.2}
.lang button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:700}
.lang button.ur{font-family:"Noto Nastaliq Urdu",sans-serif;font-size:13px;padding-top:2px;padding-bottom:6px}

.tools{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.pick{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:8px;padding:10px 16px}
.pick input{width:100%;height:50px;border:1px solid var(--line);border-radius:var(--r);padding:0 14px;background:var(--surface);font-size:16px}
.ddw{position:relative}
.dd{width:100%;height:50px;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;align-content:center;column-gap:8px;text-align:start;border:1.5px solid var(--cobalt);background:var(--surface);border-radius:var(--r);padding:0 12px;cursor:pointer}
.dd .ddl{grid-column:1;font-size:11.5px;color:var(--ink2);line-height:1.2}
.dd .ddv{grid-column:1;font-weight:700;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang=ur] .dd .ddl{line-height:1.5}html[lang=ur] .dd .ddv{line-height:1.6;font-size:14px}
.dd .car{grid-column:2;grid-row:1/3;width:10px;height:10px;border-right:2.5px solid var(--cobalt);border-bottom:2.5px solid var(--cobalt);transform:rotate(45deg) translateY(-3px);transition:transform .15s}
.dd[aria-expanded=true] .car{transform:rotate(225deg) translateY(-3px)}
.ddp{position:absolute;top:calc(100% + 6px);inset-inline-start:0;width:min(92vw,420px);max-height:min(64vh,560px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgba(22,36,58,.22);z-index:35;padding:6px}
.opt{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:10px;width:100%;border:0;background:none;padding:6px 8px;border-radius:8px;text-align:start;cursor:pointer;font-size:14.5px;line-height:1.3}
html[lang=ur] .opt{line-height:1.9;font-size:14px}
.opt:hover,.opt:focus-visible{background:#EEF2FF}
.opt[aria-selected=true]{background:var(--cobalt);color:#fff}
.opt[aria-selected=true] .ct{background:rgba(255,255,255,.18);color:#fff}
.opt img,.opt .ic{width:40px;height:40px;border-radius:8px;object-fit:contain;background:#fff;border:1px solid var(--line)}
.opt .ic{display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--cobalt);font-family:"Archivo",sans-serif}
.opt .ct{font-family:"Archivo",sans-serif;font-size:12px;font-weight:700;color:var(--copper);background:var(--copper-bg);border-radius:6px;padding:1px 7px;font-variant-numeric:tabular-nums}
@media (max-width:560px){.pick{grid-template-columns:1fr}.ddp{width:100%}}
.rail{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none;max-width:1180px;margin:0 auto;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;height:38px;padding:0 12px 0 4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;cursor:pointer;white-space:nowrap;font-size:13.5px;scroll-snap-align:start}
html[lang=ur] .chip{font-size:13px;line-height:1.6}
.chip img{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#fff;border:1px solid var(--line)}
.chip .n{font-family:"Archivo",sans-serif;color:var(--ink2);font-size:12px;font-variant-numeric:tabular-nums}
.chip.all{padding:0 14px;font-weight:700}
.chip[aria-pressed=true]{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.chip[aria-pressed=true] .n{color:#C9D5FF}

main{padding:18px 0 24px}
h2.sec{font-weight:800;font-stretch:112%;font-size:22px;margin:4px 0 4px;letter-spacing:-.01em}
html[lang=ur] h2.sec{font-weight:600;font-size:20px;line-height:2}
.sub{color:var(--ink2);margin:0 0 14px;font-size:14px}

/* mosaico de categorias */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0;cursor:pointer;text-align:start;display:flex;flex-direction:column;overflow:hidden;transition:border-color .15s}
.cat:hover{border-color:var(--cobalt)}
.cat .ph{aspect-ratio:4/3;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line)}
.cat .ph img{width:100%;height:100%;object-fit:contain;padding:6px}
.cat .tx{padding:10px 12px 12px;display:flex;align-items:flex-end;gap:8px;flex:1}
.cat .nm{font-weight:700;font-size:14.5px;line-height:1.25;flex:1}
html[lang=ur] .cat .nm{font-weight:600;line-height:1.9;font-size:14px}
.cat .ct{flex:none;font-size:12px;font-weight:700;color:var(--copper);background:var(--copper-bg);border-radius:6px;padding:2px 7px;font-variant-numeric:tabular-nums;font-family:"Archivo",sans-serif;line-height:1.5}

/* productos */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.card .ph{aspect-ratio:1/1;background:#fff;position:relative;cursor:zoom-in;border:0;padding:0;width:100%}
.card .ph img{width:100%;height:100%;object-fit:contain}
.card .ph .none{display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink2);font-size:12px}
.flag{position:absolute;top:8px;inset-inline-start:8px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;color:#fff;line-height:1.4}
.flag.agotado{background:var(--bad)}.flag.preventa{background:var(--warn)}.flag.nuevo{background:var(--cobalt)}
.card .bd{padding:10px 11px 0;flex:1;display:flex;flex-direction:column;gap:6px}
.card .nm{font-weight:650;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
html[lang=ur] .card .nm{font-weight:600;line-height:1.95;font-size:13.5px;-webkit-line-clamp:2}
.specs{display:flex;flex-wrap:wrap;gap:4px}
.spec{font-family:"Archivo",sans-serif;font-stretch:88%;font-weight:700;font-size:11.5px;color:var(--copper);background:var(--copper-bg);border-radius:5px;padding:1px 6px;line-height:1.6;font-variant-numeric:tabular-nums;direction:ltr}
.spec.pk{color:var(--cobalt);background:#E6ECFF;font-family:var(--f);font-stretch:100%;direction:inherit}
.ref{font-family:"Archivo",sans-serif;font-size:11.5px;color:var(--ink2);direction:ltr;unicode-bidi:isolate}
.price{display:flex;align-items:baseline;gap:5px;margin-top:auto;padding-top:2px}
.price b{font-family:"Archivo",sans-serif;font-weight:800;font-stretch:108%;font-size:19px;font-variant-numeric:tabular-nums;direction:ltr}
.price span{font-size:12px;color:var(--ink2)}
.act{padding:10px 11px 11px}
.add{width:100%;height:40px;border:0;border-radius:var(--r);background:var(--cobalt);color:#fff;font-weight:700;cursor:pointer}
.add:hover{background:var(--cobalt-d)}
.add:disabled{background:#DCE2EA;color:#7B8799;cursor:not-allowed}
.qty{display:flex;align-items:center;justify-content:space-between;height:40px;border:1.5px solid var(--cobalt);border-radius:var(--r);background:#F2F5FF}
.qty button{width:40px;height:100%;border:0;background:none;color:var(--cobalt);font-size:22px;font-weight:700;cursor:pointer;line-height:1}
.qty .q{text-align:center;font-family:"Archivo",sans-serif;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05}
.qty .q small{display:block;font-weight:500;font-size:10.5px;color:var(--ink2)}
.empty{grid-column:1/-1;text-align:center;color:var(--ink2);padding:48px 12px}

/* barra pedido */
.bar{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--ink);color:#fff;transform:translateY(110%);transition:transform .2s}
.bar.on{transform:none}
.bar .wrap{display:flex;align-items:center;gap:12px;min-height:64px;padding-bottom:env(safe-area-inset-bottom)}
.bar .sum{flex:1;min-width:0;line-height:1.3}
.bar .sum b{font-family:"Archivo",sans-serif;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.bar .sum div{font-size:12.5px;color:#A9B7CC}
.bar .go{height:44px;padding:0 18px;border:0;border-radius:var(--r);background:#fff;color:var(--ink);font-weight:800;cursor:pointer;flex:none}
.meter{height:4px;background:#2C3D58}
.meter i{display:block;height:100%;background:var(--copper);transition:width .25s}
.meter.ok i{background:#3BC07A}

/* hoja pedido */
.ov{position:fixed;inset:0;background:rgba(14,24,40,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:50;inset-inline:0;bottom:0;margin:0 auto;max-width:620px;max-height:92vh;background:var(--surface);border-radius:18px 18px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s}
.sheet.on{transform:none}
.sh{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.sh h2{margin:0;font-size:19px;font-weight:800;font-stretch:112%}
html[lang=ur] .sh h2{font-weight:600}
.x{margin-inline-start:auto;background:none;border:0;font-size:28px;line-height:1;color:var(--ink2);cursor:pointer;width:40px;height:40px}
.body{overflow:auto;padding:4px 18px 18px;flex:1}
.ln{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ln img,.ln .noimg{width:52px;height:52px;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:#fff}
.ln .t{min-width:0}
.ln .t .nm{font-size:13.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
html[lang=ur] .ln .t .nm{line-height:1.9}
.ln .t .ref{display:block}
.ln .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ln .qty{width:112px;height:34px}.ln .qty button{width:34px;font-size:19px}
.ln .st{font-family:"Archivo",sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:14px;direction:ltr}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 6px}
.tot b{font-family:"Archivo",sans-serif;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr}
.note{font-size:12.5px;color:var(--ink2);margin:0 0 8px}
.min{border-radius:var(--r);padding:10px 12px;font-size:13.5px;background:var(--copper-bg);color:#7A3F0E;margin:6px 0 12px}
.min.ok{background:#E3F5EA;color:#155D34}
.field{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;margin:0 0 8px;background:#F8FAFC;font-size:16px}
textarea.field{height:62px;resize:vertical}
.pay{border:1.5px dashed #A7B6CA;border-radius:12px;padding:12px;margin:10px 0 12px;font-size:13.5px}
.pay h3{margin:0 0 6px;font-size:14.5px;font-weight:800}
html[lang=ur] .pay h3{font-weight:600}
.pay .row{display:flex;align-items:center;gap:8px;margin-top:6px}
.pay code{font-family:"Archivo",sans-serif;font-stretch:92%;font-weight:700;font-size:15px;letter-spacing:.02em;flex:1;direction:ltr;text-align:start;unicode-bidi:isolate}
.copy{flex:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:12.5px;cursor:pointer;font-weight:600}
.send{width:100%;height:52px;border:0;border-radius:12px;background:var(--wa);color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.send:disabled{background:#C9D3DF;color:#6E7B8E;cursor:not-allowed}
.clear{display:block;margin:10px auto 0;background:none;border:0;color:var(--ink2);text-decoration:underline;cursor:pointer;font-size:13px}
.done{text-align:center;padding:10px 0 4px}
.done .num{font-family:"Archivo",sans-serif;font-stretch:118%;font-weight:800;font-size:26px;letter-spacing:.02em;margin:6px 0;direction:ltr}
.done p{margin:6px 0;color:var(--ink2)}

.inst{background:#22324D;color:#fff}
.inst .wrap{display:flex;align-items:center;gap:10px;min-height:52px;padding-top:6px;padding-bottom:6px}
.inst img{width:34px;height:34px;border-radius:8px;flex:none}
.inst p{margin:0;flex:1;font-size:13.5px;line-height:1.3}
html[lang=ur] .inst p{line-height:1.9}
.inst .ib{flex:none;height:36px;padding:0 14px;border:0;border-radius:8px;background:#fff;color:var(--ink);font-weight:800;cursor:pointer}
.inst .ix{flex:none;background:none;border:0;color:#A9B7CC;font-size:22px;cursor:pointer;width:32px;height:36px}
.ios{position:fixed;inset-inline:12px;bottom:max(14px,env(safe-area-inset-bottom));z-index:65;background:#fff;border-radius:16px;box-shadow:0 18px 40px rgba(22,36,58,.3);padding:16px 16px 14px}
.ios h3{margin:0 0 8px;font-size:16px}
.ios ol{margin:0;padding-inline-start:20px;line-height:1.6;font-size:14.5px}
html[lang=ur] .ios ol{line-height:2.1}
.ios .ok{margin-top:12px;width:100%;height:42px;border:0;border-radius:10px;background:var(--cobalt);color:#fff;font-weight:800;cursor:pointer}
.shr{display:inline-block;width:18px;height:18px;vertical-align:-3px;border:2px solid var(--cobalt);border-top:0;border-radius:0 0 3px 3px;position:relative;margin:0 2px}
.shr:before{content:"";position:absolute;left:50%;top:-7px;width:2px;height:12px;background:var(--cobalt);transform:translateX(-50%)}
.shr:after{content:"";position:absolute;left:50%;top:-8px;width:7px;height:7px;border-left:2px solid var(--cobalt);border-top:2px solid var(--cobalt);transform:translateX(-50%) rotate(45deg)}
.lb{position:fixed;inset:0;z-index:60;background:rgba(10,18,32,.92);display:none;align-items:center;justify-content:center;padding:18px;cursor:zoom-out}
.lb.on{display:flex}.lb img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;border-radius:10px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
footer{color:var(--ink2);font-size:12px;text-align:center;padding:8px 0 20px}
@media (max-width:440px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .cats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .card .bd{padding:8px 9px 0}.act{padding:8px 9px 9px}
  .price b{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="brand" id="home">Electronical Arts<small data-t="tag"></small></button>
  <div class="lang" role="group" aria-label="Idioma">
    <button data-l="es" aria-pressed="true">ES</button><button data-l="ur" class="ur" aria-pressed="false">اردو</button>
  </div>
</div></header>

<div class="inst" id="inst" hidden><div class="wrap"><img src="icon-192.png" alt=""><p data-t="instTx"></p><button class="ib" id="instB" data-t="instB"></button><button class="ix" id="instX" aria-label="Cerrar">×</button></div></div>
<div class="ios" id="ios" hidden role="dialog"><h3 data-t="iosT"></h3><ol><li id="ios1"></li><li data-t="ios2"></li><li data-t="ios3"></li></ol><button class="ok" id="iosOk" data-t="iosOk"></button></div>
<div class="tools">
  <div class="wrap pick">
    <div class="ddw">
      <button class="dd" id="dd" aria-haspopup="listbox" aria-expanded="false" aria-controls="ddp">
        <span class="ddl" data-t="cat1"></span><span class="ddv" id="ddv"></span><span class="car" aria-hidden="true"></span>
      </button>
      <div class="ddp" id="ddp" role="listbox" hidden></div>
    </div>
    <input id="q" type="search" autocomplete="off">
  </div>
</div>

<main class="wrap">
  <h2 class="sec" id="tit"></h2>
  <p class="sub" id="sub"></p>
  <div id="view"></div>
</main>
<footer class="wrap"><span data-t="act"></span> 16/11/2026 19:33</footer>

<div class="bar" id="bar">
  <div class="meter" id="meter"><i></i></div>
  <div class="wrap">
    <div class="sum"><b id="btot"></b><div id="bsub"></div></div>
    <button class="go" id="open" data-t="ver"></button>
  </div>
</div>

<div class="ov" id="ov"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
  <div class="sh"><h2 id="shT" data-t="pedido"></h2><button class="x" id="close" aria-label="Cerrar">×</button></div>
  <div class="body" id="sbody"></div>
</section>
<div class="lb" id="lb"><img id="lbi" alt=""></div>

const $=s=>document.querySelector(s);
const eur=n=>n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const byId=Object.fromEntries(P.map(p=>[p.id,p]));
let L=store.get('lang','es'), cart=store.get('pedido_v2',{}), cat='', q='', done=null;
for(const id in cart){if(!byId[id]||byId[id].e==='agotado')delete cart[id]}
const t=k=>T[L][k];
const nm=p=>L==='ur'?p.ur:p.es;
const cn=c=>L==='ur'?c.ur:c.es;
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
P.forEach(p=>p.s=norm([p.es,p.ur,p.o,p.k,p.c].join(' ')));
function specs(p){
  const s=p.es, out=[], seen=new Set();
  const re=/(\d+(?:[.,]\d+)?\s?(?:W|A|mAh|kg|g|L)\b)|(\d+(?:[.,]\d+)?\s?m\b)|(\d+ pulgadas)|(\b4K\b)|(\b\d+ en 1\b)/gi;let m;
  while((m=re.exec(s))&&out.length<4){let v=m[0].replace(' pulgadas','"').replace(/\s(?=[a-zA-Z])/,' ');if(!seen.has(v.toLowerCase())){seen.add(v.toLowerCase());out.push(v)}}
  return out;
}
function applyLang(){
  document.documentElement.lang=L; document.documentElement.dir=L==='ur'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  $('#q').placeholder=t('buscar');$('#q').setAttribute('aria-label',t('buscar'));
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L));
  rail();render();bar();if($('#sheet').classList.contains('on'))sheet();
}
function rail(){
  const c=C.find(x=>x.k===cat);$('#ddv').textContent=c?cn(c):t('todo');
  $('#ddp').innerHTML=`<button class="opt" role="option" data-c="" aria-selected="${!cat}"><span class="ic">⊞</span><span>${t('todo')}</span><span class="ct">${P.length}</span></button>`+

}
function dd(open){const p=$('#ddp'),b=$('#dd');if(open===undefined)open=p.hidden;p.hidden=!open;b.setAttribute('aria-expanded',open);if(open){const s=p.querySelector('[aria-selected=true]');if(s)s.scrollIntoView({block:'nearest'})}}
function qtyH(p){const n=cart[p.id]||0;return `<div class="qty"><button data-m="${p.id}" aria-label="−">−</button><div class="q">${n}<small>${p.pk>1?(n/p.pk)+' '+t('paq'):t('uds')}</small></div><button data-p="${p.id}" aria-label="+">+</button></div>`}
function actH(p){if(p.e==='agotado')return `<button class="add" disabled>${t('agotado')}</button>`;return cart[p.id]?qtyH(p):`<button class="add" data-p="${p.id}">${t('add')}</button>`}
function card(p){
  const f=p.e?`<span class="flag ${p.e}">${t(p.e)}</span>`:(p.nuevo?`<span class="flag nuevo">${t('nuevo')}</span>`:'');
  const sp=specs(p).map(x=>`<span class="spec">${esc(x)}</span>`).join('')+(p.pk>1?`<span class="spec pk">${esc(t('pack')(p.pk))}</span>`:'');
  return `<article class="card"><button class="ph" data-z="${p.img}" aria-label="${esc(nm(p))}">${p.img?`<img loading="lazy" src="${p.img}" alt="">`:`<span class="none">—</span>`}${f}</button>
  <div class="bd"><div class="nm">${esc(nm(p))}</div>${sp?`<div class="specs">${sp}</div>`:''}<div class="ref">Ref. ${esc(p.k)}</div>
  <div class="price"><b>${eur(p.p)}</b><span>${t('ud')}</span></div></div><div class="act" id="a${p.id}">${actH(p)}</div></article>`;
}
function render(){
  const v=$('#view'), qq=norm(q.trim()), words=qq.split(/\s+/).filter(Boolean);
  const list=P.filter(p=>(!cat||p.c===cat)&&words.every(w=>p.s.includes(w)));

  $('#sub').textContent=list.length+' '+t('prods')+(qq&&c?' · '+cn(c):'');
  v.innerHTML='<div class="grid">'+(list.length?list.map(card).join(''):`<div class="empty">${t('nada')}</div>`)+'</div>';

function totals(){let s=0,n=0;for(const id in cart){s+=cart[id]*byId[id].p;n++}return{s:Math.round(s*100)/100,n}}
function bar(){
  const {s,n}=totals();$('#bar').classList.toggle('on',n>0);

  <button class="clear" id="clear">${t('vaciar')}</button>`;

function payH(num){

  ${num?`<div class="row"><span>Concepto:</span><code>${num}</code><button class="copy" data-copy="${num}">${t('copiar')}</button></div>`:''}</div>`;
}
function refresh(id){const e=document.getElementById('a'+id);if(e)e.innerHTML=actH(byId[id]);bar();if($('#sheet').classList.contains('on'))sheet()}
function add(id,d){const p=byId[id];const n=Math.max(0,(cart[id]||0)+d*p.pk);if(n)cart[id]=n;else delete cart[id];store.set('pedido_v2',cart);refresh(id)}
function openSheet(v){$('#sheet').classList.toggle('on',v);$('#ov').classList.toggle('on',v);if(v)sheet();else if(done){done=null}}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1600)}
function numPedido(){const d=new Date(),z=n=>String(n).padStart(2,'0');const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let r='';for(let i=0;i<4;i++)r+=a[Math.floor(Math.random()*a.length)];return PREF+'-'+String(d.getFullYear()).slice(2)+z(d.getMonth()+1)+z(d.getDate())+'-'+r}
function enviar(){
  const cli=$('#cli').value.trim();if(!cli){$('#cli').focus();toast(t('nomReq'));return}
  store.set('cliente',cli);
  const {s}=totals();if(s<MIN)return;
  const num=numPedido();
  const ls=Object.keys(cart).map(id=>{const p=byId[id],n=cart[id];return `• ${n} uds${p.pk>1?' ('+(n/p.pk)+' paq.)':''} — Ref. ${p.k} — ${p.es} — ${eur(n*p.p)}`});
  const obs=$('#obs').value.trim();
  let txt=`🛒 *Pedido ${num}* — ${TIENDA}\nCliente: ${cli}`+(L==='ur'?'\nIdioma del cliente: urdu':'')+`\n\n${ls.join('\n')}\n\n*Total: ${eur(s)}*`+(obs?`\n\nComentarios: ${obs}`:'');
  if(IBAN)txt+=`\n\nPago por transferencia\nTitular: ${TITULAR}\nIBAN: ${IBAN}\nConcepto: ${num}\nDespués de pagar, envía por este chat la captura del justificante.`;
  window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(txt),'_blank');
  done={num,total:s};cart={};store.set('pedido_v2',cart);render();bar();sheet();toast(t('enviando'));
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.ddw'))dd(false);
  if(e.target.closest('#dd')){dd();return}
  const el=e.target.closest('[data-p],[data-m],[data-z],[data-c],[data-l],[data-copy],#send,#clear,#again,#captura');if(!el)return;
  if(el.dataset.p)add(el.dataset.p,1);
  else if(el.dataset.m)add(el.dataset.m,-1);
  else if(el.dataset.z!==undefined){if(el.dataset.z){$('#lbi').src=el.dataset.z;$('#lb').classList.add('on')}}
  else if(el.dataset.c!==undefined){cat=el.dataset.c;dd(false);rail();render();window.scrollTo({top:0})}
  else if(el.dataset.l){L=el.dataset.l;store.set('lang',L);applyLang()}
  else if(el.dataset.copy){navigator.clipboard&&navigator.clipboard.writeText(el.dataset.copy).then(()=>toast(t('copiado')),()=>{})}
  else if(el.id==='send')enviar();
  else if(el.id==='clear'){cart={};store.set('pedido_v2',cart);render();bar();sheet()}
  else if(el.id==='again'){done=null;openSheet(false)}
  else if(el.id==='captura'&&done){window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(`Justificante de pago del pedido ${done.num} (${eur(done.total)}). Adjunto la captura.`),'_blank')}
});
$('#lb').onclick=()=>$('#lb').classList.remove('on');
$('#open').onclick=()=>openSheet(true);$('#close').onclick=$('#ov').onclick=()=>openSheet(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){dd(false);openSheet(false);$('#lb').classList.remove('on')}});
$('#home').onclick=()=>{cat='';q='';$('#q').value='';rail();render();window.scrollTo({top:0})};
let tm;$('#q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{q=e.target.value;render()},140)};
let deferred=null;
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
function showInst(){if(standalone||store.get('instNo',0)>Date.now())return;$('#inst').hidden=false}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;showInst()});
addEventListener('appinstalled',()=>{$('#inst').hidden=true});
if(isIOS)showInst();
$('#instB').onclick=async()=>{if(deferred){deferred.prompt();const r=await deferred.userChoice;deferred=null;if(r.outcome==='accepted')$('#inst').hidden=true}else if(isIOS){$('#ios1').innerHTML=esc(t('ios1'))+' <span class="shr" aria-hidden="true"></span>';$('#ios').hidden=false}};
$('#instX').onclick=()=>{$('#inst').hidden=true;store.set('instNo',Date.now()+7*864e5)};
$('#iosOk').onclick=()=>{$('#ios').hidden=true};
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
applyLang();
</script>
</body>
</html>
