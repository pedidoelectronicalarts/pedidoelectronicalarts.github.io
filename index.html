<head>

<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16181d;--muted:#6b7280;--line:#e5e7eb;--acc:#1f7a4d;--acc2:#25d366;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box}html,body{margin:0}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.top{max-width:1200px;margin:0 auto;padding:12px 16px 8px;display:flex;gap:12px;align-items:center}
.top h1{font-size:19px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .upd{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.bar{max-width:1200px;margin:0 auto;padding:0 16px 10px;display:flex;gap:8px}
.bar input,.bar select{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;background:#fafafa;min-width:0}
.bar input{flex:1}.bar select{max-width:42%}
main{max-width:1200px;margin:0 auto;padding:14px 16px}
.count{color:var(--muted);font-size:13px;margin:0 2px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:var(--card);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.ph{aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center;cursor:zoom-in;position:relative}
.ph img{width:100%;height:100%;object-fit:contain}
.ph .noimg{color:var(--muted);font-size:12px}
.tag{position:absolute;top:8px;left:8px;font-size:11px;font-weight:600;padding:3px 7px;border-radius:6px;background:#111;color:#fff}
.tag.preventa{background:var(--warn)}.tag.agotado{background:var(--bad)}.tag.nuevo{background:var(--acc)}
.info{padding:10px 10px 0;flex:1}
.nm{font-weight:600;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.n2{font-size:12px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.cd{font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.pr{display:flex;align-items:baseline;gap:6px;margin-top:6px}
.pr b{font-size:17px;font-variant-numeric:tabular-nums}.pr span{font-size:12px;color:var(--muted)}
.act{padding:10px;display:flex;align-items:center;gap:6px}
.btn{border:0;border-radius:10px;height:38px;font:inherit;font-weight:600;cursor:pointer}
.add{flex:1;background:var(--acc);color:#fff}
.add:disabled{background:#d1d5db;color:#6b7280;cursor:not-allowed}
.qty{flex:1;display:flex;align-items:center;justify-content:space-between;background:#eef7f1;border-radius:10px;height:38px}
.qty button{width:38px;height:38px;border:0;background:transparent;font-size:20px;font-weight:700;color:var(--acc);cursor:pointer}
.qty .q{font-weight:700;font-variant-numeric:tabular-nums;text-align:center;line-height:1.05}
.qty .q small{display:block;font-size:10px;font-weight:500;color:var(--muted)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));z-index:30;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:14px 22px;font:inherit;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;gap:10px;align-items:center;cursor:pointer;white-space:nowrap}
.fab.on{display:flex}.fab .pill{background:var(--acc2);color:#063;border-radius:999px;padding:2px 9px;font-size:13px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}.ov.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;background:#fff;border-radius:18px 18px 0 0;z-index:50;transform:translateY(105%);transition:transform .25s;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.sh{padding:16px 18px 10px;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.sh h2{margin:0;font-size:18px}.sh .x{margin-left:auto;background:none;border:0;font-size:26px;cursor:pointer;color:var(--muted)}
.lines{overflow:auto;padding:6px 18px;flex:1}
.ln{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ln img{width:52px;height:52px;object-fit:contain;border-radius:8px;background:#fafafa;flex:none}
.ln .t{flex:1;min-width:0;font-size:14px}.ln .t div{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ln .t .s{font-size:12px;color:var(--muted)}
.ln .qty{flex:none;width:108px;height:34px}.ln .qty button{width:34px;height:34px}
.ln .sub{width:64px;font-size:14px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.foot{padding:12px 18px max(16px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin-bottom:4px}
.nota{font-size:12px;color:var(--muted);margin-bottom:10px}
.foot input,.foot textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;margin-bottom:8px;background:#fafafa}
.foot textarea{height:56px;resize:vertical}
.wa{width:100%;background:var(--acc2);color:#05391c;height:50px;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.vaciar{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:13px;cursor:pointer;margin-top:8px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:60;display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lb.on{display:flex}.lb img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;border-radius:8px}
.empty{text-align:center;color:var(--muted);padding:60px 0}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,1fr);gap:8px}.info{padding:8px 8px 0}.act{padding:8px}.pr b{font-size:16px}}
</style>
</head>

const byId=Object.fromEntries(P.map(p=>[p.id,p]));
const eur=n=>n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const K='pedido_v1';
let cart={};try{cart=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
for(const id in cart){if(!byId[id]||byId[id].e==='agotado')delete cart[id]}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(cart))}catch(e){}};
const $=s=>document.querySelector(s);
const selCat=$('#cat');CATS.forEach(c=>{const o=document.createElement('option');o.value=o.textContent=c;selCat.appendChild(o)});
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function qtyHtml(p){const q=cart[p.id]||0;return `<div class="qty"><button data-m="${p.id}" aria-label="Quitar">−</button><div class="q">${q}<small>${p.pk>1?(q/p.pk)+' paq.':'uds'}</small></div><button data-p="${p.id}" aria-label="Añadir">+</button></div>`}
function actHtml(p){if(p.e==='agotado')return '<button class="btn add" disabled>Agotado</button>';return cart[p.id]?qtyHtml(p):`<button class="btn add" data-p="${p.id}">Añadir${p.pk>1?' (pack '+p.pk+')':''}</button>`}
function card(p){
  const tag=p.e==='agotado'?'<span class="tag agotado">Agotado</span>':p.e==='preventa'?'<span class="tag preventa">Preventa</span>':p.nuevo?'<span class="tag nuevo">Nuevo</span>':'';
  return `<div class="card"><div class="ph" data-z="${p.img}">${p.img?`<img loading="lazy" src="${p.img}" alt="${esc(p.n)}">`:'<span class="noimg">Sin foto</span>'}${tag}</div>
  <div class="info"><div class="nm">${esc(p.n)}</div>${p.n2?`<div class="n2">${esc(p.n2)}</div>`:''}<div class="cd">Ref. ${esc(p.k)}${p.pk>1?' · pack de '+p.pk+' uds':''}</div>
  <div class="pr"><b>${eur(p.p)}</b><span>/ ud</span></div></div><div class="act" id="a${p.id}">${actHtml(p)}</div></div>`}
let lista=[];
function render(){
  const q=norm($('#q').value.trim()),c=selCat.value;
  lista=P.filter(p=>(!c||p.c===c)&&(!q||norm(p.n+' '+p.n2+' '+p.k+' '+p.c).includes(q)));
  $('#count').textContent=lista.length+' productos';
  $('#grid').innerHTML=lista.length?lista.map(card).join(''):'<div class="empty">No hay productos con esa búsqueda.</div>';
}
function refreshItem(id){const el=document.getElementById('a'+id);if(el)el.innerHTML=actHtml(byId[id]);updateCart()}
function add(id,d){const p=byId[id];const q=Math.max(0,(cart[id]||0)+d*p.pk);if(q)cart[id]=q;else delete cart[id];save();refreshItem(id)}
function updateCart(){
  const ids=Object.keys(cart);let tot=0,uds=0;ids.forEach(id=>{tot+=cart[id]*byId[id].p;uds+=cart[id]});
  $('#fab').classList.toggle('on',ids.length>0);$('#fabt').textContent=ids.length+' ref · '+eur(tot);$('#total').textContent=eur(tot);
  $('#lines').innerHTML=ids.length?ids.map(id=>{const p=byId[id];return `<div class="ln">${p.img?`<img src="${p.img}" alt="">`:''}<div class="t"><div>${esc(p.n)}</div><div class="s">Ref. ${esc(p.k)} · ${eur(p.p)}/ud</div></div>${qtyHtml(p)}<div class="sub">${eur(cart[id]*p.p)}</div></div>`}).join(''):'<div class="empty">Tu pedido está vacío.</div>';
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-p],[data-m],[data-z]');if(!t)return;
  if(t.dataset.p)add(t.dataset.p,1);else if(t.dataset.m)add(t.dataset.m,-1);
  else if(t.dataset.z){$('#lbimg').src=t.dataset.z;$('#lb').classList.add('on')}
});
$('#lb').onclick=()=>$('#lb').classList.remove('on');
const abrir=v=>{$('#sheet').classList.toggle('on',v);$('#ov').classList.toggle('on',v)};
$('#fab').onclick=()=>abrir(true);$('#cerrar').onclick=$('#ov').onclick=()=>abrir(false);
$('#vaciar').onclick=()=>{if(!Object.keys(cart).length)return;cart={};save();render();updateCart()};
try{$('#cli').value=localStorage.getItem('cliente')||''}catch(e){}
$('#enviar').onclick=()=>{
  const ids=Object.keys(cart);if(!ids.length){alert('Tu pedido está vacío');return}
  const cli=$('#cli').value.trim();if(!cli){$('#cli').focus();$('#cli').placeholder='Escribe tu nombre para enviar el pedido';return}
  try{localStorage.setItem('cliente',cli)}catch(e){}
  let tot=0;const ls=ids.map(id=>{const p=byId[id],q=cart[id],s=q*p.p;tot+=s;return `• ${q} uds${p.pk>1?' ('+(q/p.pk)+' paq.)':''} — ${p.k} ${p.n} — ${eur(s)}`});
  const obs=$('#obs').value.trim();
  const txt=`🛒 *Pedido — ${TIENDA}*\nCliente: ${cli}\n\n${ls.join('\n')}\n\n*Total: ${eur(tot)}*`+(obs?`\n\nComentarios: ${obs}`:'');
  window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(txt),'_blank');
};
let tm;$('#q').oninput=()=>{clearTimeout(tm);tm=setTimeout(render,150)};selCat.onchange=render;
render();updateCart();
